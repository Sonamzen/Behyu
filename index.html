<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--grid:#d9fbfb;--ink:#1d1b26;--mint:#c4f8fb;--pink:#fcb5ff;--pink-soft:#fbd9ff;--cream:#fff0e1;--tag:#f6cf94;--tag-in:#fbe0b4;--peach:#ffdccb;--bad:#b3261e;

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);background:#fff;font:18px 'Patrick Hand',system-ui,sans-serif;
  background-image:linear-gradient(var(--grid) 2px,transparent 2px),linear-gradient(90deg,var(--grid) 2px,transparent 2px);background-size:26px 26px}
h1,h2,h3,button,.btn{font-family:'Chewy','Patrick Hand',system-ui,sans-serif;font-weight:400}
button{color:var(--ink);cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1100px;margin:0 auto;padding:14px 20px}
.mark{appearance:none;border:0;background:none;font-size:34px;padding:0;letter-spacing:1px}
.mark b{font-weight:400;-webkit-text-stroke:1px #8fe3ea;color:var(--mint)}.mark i{font-style:normal;-webkit-text-stroke:1px #f08af5;color:var(--pink)}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.pill{appearance:none;border:0;font-size:18px;padding:7px 14px;background:var(--tag-in);box-shadow:0 0 0 3px var(--tag);border-radius:6px}
.pill:hover{background:var(--pink-soft)}
main{max-width:1100px;margin:0 auto;padding:10px 20px 90px;min-height:80vh}
.btn{appearance:none;border:0;font-size:20px;padding:10px 22px;background:var(--tag-in);box-shadow:0 0 0 3px var(--tag);border-radius:6px 12px 8px 14px/12px 6px 14px 8px}
.btn:hover{transform:rotate(-1.5deg)}.btn.sm{font-size:16px;padding:5px 12px}.btn.main{background:var(--pink);box-shadow:0 0 0 3px var(--ink)}
.btn[disabled]{opacity:.5;cursor:default}
.logo{margin:10px 0 0;text-align:center;font-size:clamp(84px,19vw,180px);line-height:1;font-weight:400}
.be{color:var(--mint);-webkit-text-stroke:2px #8fe3ea}.hyu{color:var(--pink);-webkit-text-stroke:2px #f08af5}
.lead{text-align:center;opacity:.75;margin:4px 0 30px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 26px;max-width:940px;margin:0 auto}
.cats .w{grid-column:span 2}
.cat{appearance:none;border:0;font-size:24px;padding:20px 12px;background:var(--cream);border-radius:6px 14px 8px 16px/14px 6px 16px 8px;box-shadow:0 0 0 2px var(--ink) inset;transition:transform .15s}

.cuts{position:fixed;bottom:0;width:100px;pointer-events:none}.cuts.l{left:6px}.cuts.r{right:6px}
.ttl{display:flex;justify-content:center;margin:6px 0 28px}
.banner{margin:0;font-size:clamp(26px,6vw,42px);padding:6px 40px 8px;background:var(--pink-soft);border:2px solid var(--ink);border-top-width:0;border-radius:0 0 8px 8px;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:28px 22px}
.card{position:relative}
.open{appearance:none;border:0;background:none;padding:0;width:100%;text-align:center;font:inherit}
.photo{aspect-ratio:1;background:#fff;display:grid;place-items:center;position:relative;overflow:hidden}
.photo::before{content:"";position:absolute;top:12px;left:-14px;width:70px;height:22px;background:var(--peach);transform:rotate(-45deg)}
.photo img{max-width:88%;max-height:88%;object-fit:contain;position:relative}.photo span{opacity:.35;position:relative}
.label{display:block;margin:10px 6px 0;padding:8px 14px;font-family:'Chewy',sans-serif;font-size:17px;line-height:1.25;background:var(--tag-in);border-radius:10px;box-shadow:0 0 0 4px var(--tag)}
.heart{position:absolute;top:8px;right:8px;z-index:2;appearance:none;border:2px solid var(--ink);background:#fff;border-radius:50%;width:38px;height:38px;font-size:20px;line-height:1;padding:0}
.heart[aria-pressed=true]{background:var(--pink)}
.sheet{background:#fff;border:2px solid var(--ink);border-radius:4px 10px 6px 12px/10px 4px 12px 6px;padding:22px}
label.f{display:block;font-family:'Chewy',sans-serif;font-size:19px;margin:14px 0 6px}
input[type=text],input[type=email],input[type=password],input[type=tel],select{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink)}

.two{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}

.th{width:76px;height:76px;border:2px solid var(--ink);display:grid;place-items:center;overflow:hidden;flex:none;font-size:13px;opacity:.9}

.step.on{background:var(--pink);opacity:1}.step.done{background:var(--tag-in);opacity:1}
.opt{display:flex;gap:10px;align-items:center;padding:12px;margin:8px 0;border:2px solid var(--ink);border-radius:8px;font-size:19px;cursor:pointer}

.info{background:var(--cream);border:2px dashed var(--ink);padding:12px;border-radius:8px;margin:10px 0}

.nav2{display:flex;justify-content:space-between;margin-top:22px;gap:10px}
.empty{text-align:center;opacity:.75;margin:50px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{appearance:none;border:0;padding:6px 16px;font-size:18px;background:var(--tag-in);box-shadow:0 0 0 3px var(--tag);border-radius:4px}
.chip[aria-pressed=true]{background:var(--pink);box-shadow:0 0 0 3px var(--ink)}
dialog{border:2px solid var(--ink);border-radius:8px;padding:22px;width:min(460px,94vw);background:#fff;color:var(--ink)}
dialog::backdrop{background:rgba(29,27,38,.4)}

.toast.show{opacity:1}
dialog{max-height:90vh;overflow:auto}
textarea{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink);resize:vertical}
.rv{display:block;margin-top:6px;color:#b9790a}
.rev{border-top:2px dashed var(--tag);padding:8px 0;font-size:17px}.rev span{color:#b9790a}
.acct{position:relative;min-height:170px}.acct .bk{top:0}
.helpb{position:absolute;right:0;top:0;display:flex;flex-direction:column;align-items:center;appearance:none;border:0;background:none;font-family:'Chewy',sans-serif;font-size:15px}

.rule{border:0;border-top:3px solid var(--ink);margin:14px 0}
.mo{font-size:28px;margin:18px 0 12px}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:34px}
.tile{appearance:none;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:8px;font-family:'Chewy',sans-serif;font-size:17px;text-align:center}
.ico{position:relative;display:grid;place-items:center;height:56px}.ico svg{height:52px;width:auto}.ico .h{font-size:50px;line-height:1;color:#f48fb1}
.bdg{position:absolute;top:-4px;right:-16px;background:var(--pink);border:2px solid var(--ink);border-radius:12px;min-width:24px;font-style:normal;font-size:14px;padding:0 5px}
.help{max-width:560px;margin:10px auto}.hi{display:flex;gap:16px;align-items:flex-start;margin:34px 0;font-size:20px}.hi i{width:28px;height:28px;border-radius:50%;background:#fcc9ff;flex:none}.hi p{margin:0}

/* flowers and stars on every page */
.decor{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;color:var(--pink)}
.dd{position:absolute;width:92px;height:92px;opacity:.85}
.dd.f1{top:64px;left:2%}.dd.f2{top:64px;right:2%}
.dd.s1{top:34%;left:1.5%;width:74px;height:74px}.dd.s2{top:38%;right:1.5%;width:74px;height:74px}
.dd.f3{bottom:24%;left:3.5%;width:64px;height:64px}.dd.s3{bottom:28%;right:4%;width:64px;height:64px}

.top,main{position:relative;z-index:1}
a.btn{text-decoration:none;color:var(--ink);display:inline-block}
.foot{text-align:center;margin-top:50px;font-size:16px;opacity:.85}
.foot button,.linkbtn{appearance:none;border:0;background:none;font:inherit;text-decoration:underline;color:var(--ink);cursor:pointer}
.policy h3{margin:20px 0 4px;font-size:22px}.policy p{margin:6px 0}
.contact{margin-top:34px}
.thumbs{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.thumbb{width:52px;height:52px;padding:2px;border:2px solid var(--ink);background:#fff;border-radius:6px;cursor:pointer}
.thumbb[aria-pressed=true]{border-color:#d56adb;box-shadow:0 0 0 3px var(--pink)}
.thumbb img{width:100%;height:100%;object-fit:contain}
.ttl{position:relative}
.bk{position:absolute;left:0;top:8px;appearance:none;border:0;background:none;font-size:22px}
.bk:hover{text-decoration:underline wavy var(--pink)}
.cartbar{position:fixed;left:0;right:0;bottom:0;background:#ffc9ff;display:flex;align-items:center;gap:16px;padding:12px 24px calc(12px + env(safe-area-inset-bottom,0px));z-index:5;font-family:'Chewy',sans-serif;font-size:24px}
.cartbar .all{display:flex;align-items:center;gap:10px;margin-right:auto}
.cartbar input,.pick{width:24px;height:24px;accent-color:#d56adb;flex:none}
.cartbar .tot{font-size:28px}
.chk{background:#e0c6fa;box-shadow:0 0 0 3px var(--ink);font-size:26px;padding:10px 28px;border-radius:20px 10px 18px 12px}
.crow{display:flex;align-items:center;gap:16px;padding:14px 0;flex-wrap:wrap}
.step2{display:inline-flex;align-items:center;gap:12px;background:#cfe3a8;border:3px solid var(--ink);border-radius:8px;padding:6px 14px;font-family:'Chewy',sans-serif;font-size:26px;box-shadow:4px 4px 0 #b9d089}
.step2 button{appearance:none;border:2px solid var(--ink);background:#fff;border-radius:6px;width:32px;height:32px;font-size:20px;padding:0}
.mv{display:flex;flex-direction:column;align-items:center;gap:2px;appearance:none;border:0;background:none;font-size:14px;font-family:'Chewy',sans-serif}
.mv .hh{font-size:44px;line-height:1;color:#f48fb1}
.trash{appearance:none;border:0;background:none;padding:4px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px 60px;max-width:900px;margin:0 auto}
.pgrid h2{font-size:30px;margin:0 0 12px}
.rad{display:flex;align-items:center;gap:12px;margin:12px 0;font-size:20px;cursor:pointer}
.rad input{width:26px;height:26px;accent-color:#b99ae6;flex:none}.rad[aria-disabled=true]{opacity:.45;cursor:default}
.upl{position:relative;display:grid;place-items:center;text-align:center;min-height:130px;background:#fbf6d9;padding:12px;cursor:pointer;font-family:'Chewy',sans-serif;font-size:20px;margin:16px 0 14px;overflow:hidden}
.upl:focus-within{outline:3px solid var(--pink)}
.upl img{max-width:100%;max-height:160px}
.jn{width:100%;padding:16px;font-family:'Chewy',sans-serif;font-size:20px;text-align:center;background:#fcdcdc;border:3px solid #e9a9a9;border-radius:14px;color:var(--ink)}
.pdone{display:block;margin:20px auto 0;background:#bde8fb;border:2px dashed var(--ink);border-radius:18px;padding:14px 26px;font-size:22px;box-shadow:none}
@media (max-width:760px){.pgrid{grid-template-columns:1fr}.cartbar{padding-left:14px;padding-right:14px;font-size:20px}}
@media (max-width:760px){.cats{grid-template-columns:repeat(2,1fr)}.cats .w{grid-column:auto}.two{grid-template-columns:1fr}.cuts{width:70px}}
@media (prefers-reduced-motion:reduce){.btn:hover,.cat:hover{transform:none}.toast,.cat{transition:none}}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ---- Shop settings. The key below is the PUBLIC key: it is meant to be in the website. ---- */
const SB_URL="https://xaziorrqepvwvypzyxdw.supabase.co";
const SB_KEY="sb_publishable_a7OOVu12WoTwTKOelWo-Vw_lTavYp3h";
const sb=supabase.createClient(SB_URL,SB_KEY);
const CATS=["Women","Men","Bags","Lens","Accessories","Makeup"];
/* ===== YOUR SHOP DETAILS: edit these before you open ===== */
/* Shipping: free in freeDzongkhag and for click and collect; free when items come to freeFrom or more; otherwise fee.
   If you change these numbers, also change them in behyu-supabase-update-3.sql (the "SHIPPING" lines) and run it again. */
const SHIPPING={fee:100,freeDzongkhag:"Thimphu",freeFrom:5000};
const DZ=["Bumthang","Chhukha","Dagana","Gasa","Haa","Lhuentse","Mongar","Paro","Pemagatshel","Punakha","Samdrup Jongkhar","Samtse","Sarpang","Thimphu","Trashigang","Trashiyangtse","Trongsa","Tsirang","Wangdue Phodrang","Zhemgang"];
const shipFee=(ship,town,sub)=>(ship==="collect"||town===SHIPPING.freeDzongkhag||sub>=SHIPPING.freeFrom)?0:SHIPPING.fee;
const PAY_INFO="Send your payment to the Bank of Bhutan (BoB) merchant account number 20666666.";   /* shown to customers who pay by mBoB / mPay */
const SHOP={returnAddress:"Babesa, Thimphu",phone:"17777777",whatsapp:""};     /* shown on the Help center page */
/* whatsapp: your number with country code, no + or spaces, e.g. "97517777777". Leave "" to hide the WhatsApp button. */
/* Click and collect pickup points are added and edited in the admin page (Pickup points button). */
const SHIP={post:"Post office",taxi:"Taxi / bus",collect:"Click and collect"};
const ST={placed:"toship",approved:"toship",rejected:"toship",shipped:"toreceive",delivered:"toreview",completed:"done"};
const STL={placed:"Placed",approved:"Payment approved",rejected:"Payment not accepted"};
let PRODUCTS=[],pickups=[];
let user=null,after=null,cart=[],wish=new Set(),co={},lastOrder=null,mode="login",cur=null,orders=[],reviews=[],rv=null;
const pubUrl=(bucket,path)=>path?sb.storage.from(bucket).getPublicUrl(path).data.publicUrl:"";

async function loadProducts(){
  const{data,error}=await sb.from("products").select("*").eq("active",true).order("id");
  if(error)return toast("Couldn’t load products");
  PRODUCTS=data.map(r=>{const paths=(r.image_paths&&r.image_paths.length)?r.image_paths:(r.image_path?[r.image_path]:[]),imgs=paths.map(x=>pubUrl("product-images",x));return{id:r.id,cat:r.category,name:r.name,price:r.price,stock:r.stock,sizes:r.sizes||[],img:imgs[0]||"",imgs}});
}
async function loadPickups(){
  const{data}=await sb.from("pickup_points").select("*").eq("active",true).order("dzongkhag").order("name");
  pickups=data||[];
}
function pickId(){const here=pickups.filter(p=>p.dzongkhag===co.town),x=here.find(y=>String(y.id)===String(co.point))||here[0];return x?x.id:null}
async function loadReviews(){
  const{data}=await sb.from("reviews").select("*").order("created_at",{ascending:false});
  reviews=(data||[]).map(r=>({pid:r.product_id,name:r.reviewer_name,rating:r.rating,text:r.comment||"",date:new Date(r.created_at).toLocaleDateString("en-GB")}));
}
async function loadOrders(){
  if(!user){orders=[];return}
  const{data}=await sb.from("orders").select("*,order_items(*)").order("id",{ascending:false});
  orders=(data||[]).map(o=>({...o,shipLabel:SHIP[o.shipping_method],where:o.shipping_method==="collect"?(o.pickup_point||""):`${o.address}, ${o.town}`}));
}
async function loadUser(session){
  if(!session){user=null;wish=new Set();return}
  const{data}=await sb.from("profiles").select("*").eq("id",session.user.id).single();
  const em=session.user.email||"";
  user={id:session.user.id,email:em,name:(data&&data.full_name)||em.split("@")[0],phone:(data&&data.phone)||"",avatarPath:data&&data.avatar_url,avatar:pubUrl("avatars",data&&data.avatar_url)};
  const w=await sb.from("wishlist").select("product_id");
  wish=new Set((w.data||[]).map(x=>x.product_id));
}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nu=n=>"Nu."+n;
const P=id=>PRODUCTS.find(p=>p.id===id);
const thumb=p=>p.img?`<img src="${p.img}" alt="">`:"photo";
const rvs=pid=>reviews.filter(r=>r.pid===pid);
const avg=pid=>{const a=rvs(pid);return a.length?a.reduce((s,r)=>s+r.rating,0)/a.length:0};
const star=n=>"★".repeat(Math.round(n))+"☆".repeat(5-Math.round(n));

async function route(){
  const h=location.hash.slice(1)||"home",app=$("app");
  if(!user&&(h==="account"||h==="vouchers"||h.startsWith("orders-"))){after=h;return go("login")}
  if(user&&(h==="account"||h.startsWith("orders-")))await loadOrders();
  if(h==="newpassword"&&!user)return go("login");
  if(CATS.some(c=>c.toLowerCase()===h)){app.innerHTML=pages.cat(CATS.find(c=>c.toLowerCase()===h))}
  else if(h.startsWith("orders-"))app.innerHTML=pages.orders(h.slice(7));
  else if(h==="checkout"){
    if(!total())return go("cart");
    if(!user){after="checkout";return go("login")}
    app.innerHTML=pages.checkout();
  }else if(h==="done"&&lastOrder)app.innerHTML=pages.done();
  else if(pages[h]&&h!=="done"&&h!=="cat")app.innerHTML=pages[h]();
  else app.innerHTML=pages.home();
  head();app.insertAdjacentHTML("beforeend",foot);if(route.h!==h){window.scrollTo(0,0);route.h=h}
}
addEventListener("hashchange",route);

async function toggleWish(id){
  if(!user){after=location.hash.slice(1)||"home";if($("dlg").open)$("dlg").close();toast("Log in to save items");return go("login")}
  const had=wish.has(id);
  const r=had?await sb.from("wishlist").delete().eq("product_id",id):await sb.from("wishlist").insert({user_id:user.id,product_id:id});
  if(r.error)return toast("Couldn’t update your wishlist");
  had?wish.delete(id):wish.add(id);toast(had?"Removed from wishlist":"Saved to wishlist");
  const y=scrollY;await route();scrollTo(0,y)}
function addCart(pid,size,qty){const p=P(pid),f=cart.find(i=>i.pid===pid&&i.size===size),have=f?f.qty:0;
  if(have+qty>p.stock){toast(p.stock?`Only ${p.stock} in stock`:"Sold out");return}
  f?f.qty+=qty:cart.push({pid,size,qty,sel:true});head();toast("Added to cart")}

function drawDlg(){const{p,size,qty}=cur;$("dlg").innerHTML=`<div class="photo" style="max-width:260px;margin:0 auto">${p.imgs[cur.i]?`<img src="${p.imgs[cur.i]}" alt="">`:`<span>photo soon</span>`}</div>${p.imgs.length>1?`<div class="thumbs">${p.imgs.map((u,k)=>`<button class="thumbb" data-ph="${k}" aria-pressed="${k===cur.i}" aria-label="Photo ${k+1}"><img src="${u}" alt=""></button>`).join("")}</div>`:""}
 <h2 style="margin:12px 0 2px">${esc(p.name)}</h2><b style="font-size:22px">${nu(p.price)}</b>
 ${p.sizes.length?`<div class="chips" role="group" aria-label="Size">${p.sizes.map(s=>`<button class="chip" data-s="${s}" aria-pressed="${s===size}">${s}</button>`).join("")}</div>`:""}
 <div class="qty" style="margin:6px 0 14px"><button data-dq="-1" aria-label="Fewer">−</button>${qty}<button data-dq="1" aria-label="More">+</button></div>
 <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn main" data-add ${p.stock<1?"disabled":""}>${p.stock<1?"Sold out":"Add to cart"}</button><button class="btn" data-wd aria-pressed="${wish.has(p.id)}">${wish.has(p.id)?"♥ Saved":"♡ Wishlist"}</button><button class="btn" data-x>Close</button></div>${revHTML(p)}`}
$("dlg").addEventListener("click",e=>{
  const t=e.target;if(t===$("dlg"))return $("dlg").close();
  const b=t.closest("button");if(!b)return;
  if(b.dataset.ph!==undefined)cur.i=+b.dataset.ph;
  else if(b.dataset.s!==undefined)cur.size=b.dataset.s;
  else if(b.dataset.dq)cur.qty=Math.min(Math.max(1,cur.qty+ +b.dataset.dq),Math.max(1,cur.p.stock));
  else if(b.hasAttribute("data-add")){addCart(cur.p.id,cur.size,cur.qty);return $("dlg").close()}
  else if(b.hasAttribute("data-wd"))return toggleWish(cur.p.id).then(drawDlg);
  else if(b.hasAttribute("data-x"))return $("dlg").close();
  drawDlg();
});

function openReview(oid,ix){const o=orders.find(x=>x.id===oid);rv={o,it:o.order_items[ix],rating:0,text:""};drawRv();$("rdlg").showModal()}
function drawRv(){const p={name:rv.it.product_name};$("rdlg").innerHTML=`<h2 style="margin:0 0 6px">Write a review</h2><p style="margin:0 0 8px">${esc(p.name)}</p>
 <div class="chips" role="group" aria-label="Rating">${[1,2,3,4,5].map(n=>`<button class="chip" data-r="${n}" aria-pressed="${rv.rating===n}" aria-label="${n} stars">${n} ★</button>`).join("")}</div>
 <label class="f" for="rt">Your review (optional)</label><textarea id="rt" rows="3">${esc(rv.text)}</textarea>
 <p class="err" id="rerr" role="alert"></p><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn" data-x>Cancel</button><button class="btn main" data-sub>Submit review</button></div>`}
$("rdlg").addEventListener("click",async e=>{const t=e.target;if(t===$("rdlg"))return $("rdlg").close();
  const b=t.closest("button");if(!b)return;
  if(b.dataset.r){rv.text=$("rt").value;rv.rating=+b.dataset.r;return drawRv()}
  if(b.hasAttribute("data-x"))return $("rdlg").close();
  if(b.hasAttribute("data-sub")){rv.text=$("rt").value.trim();if(!rv.rating)return $("rerr").textContent="Tap a star rating first.";
    b.disabled=true;const r=await sb.rpc("add_review",{p_item:rv.it.id,p_rating:rv.rating,p_comment:rv.text||null});b.disabled=false;
    if(r.error)return $("rerr").textContent=r.error.message;
    $("rdlg").close();toast("Thanks for your review");await loadReviews();route()}
});
function keep(){const v=id=>$(id)?$(id).value.trim():null;
  ["name","phone","addr","town"].forEach(k=>{const x=v("c_"+k);if(x!==null)co[k]=x});
  if($("pt"))co.point=$("pt").value;if($("jn"))co.journal=$("jn").value.trim()}
function fail(m){$("err").textContent=m}

$("app").addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  const d=b.dataset;
  if(d.go)return go(d.go);
  if(d.w)return toggleWish(+d.w);
  if(d.open)return openProduct(+d.open);
  if(d.q){const i=cart[+d.q],mx=Math.max(1,P(i.pid).stock);i.qty+= +d.d;if(i.qty<1)i.qty=1;if(i.qty>mx){i.qty=mx;toast("Only "+mx+" in stock")}return route()}
  if(d.rm){cart.splice(+d.rm,1);return route()}
  if(d.m){mode=d.m;return route()}
  if(b.id==="sendreset"){const em=$("fe").value.trim();if(!/^\S+@\S+\.\S+$/.test(em))return fail("Enter a valid email address.");
    b.disabled=true;const r=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});b.disabled=false;
    if(r.error)return fail(/rate limit/i.test(r.error.message)?"Too many requests right now. Please wait a little while and try again.":"We couldn’t send the email right now. Please try again later, or call us on "+SHOP.phone+".");
    $("err").style.color="#1d6b3a";return fail("If that email has an account, a reset link is on its way. Check your inbox and spam folder.")}
  if(b.id==="setpw"){const pw=$("np").value;if(pw.length<6)return fail("Password needs at least 6 characters.");
    b.disabled=true;const r=await sb.auth.updateUser({password:pw});b.disabled=false;
    if(r.error)return fail(r.error.message);toast("Password changed");return go("home")}
  if(b.id==="auth"){
    const em=$("ae").value.trim(),pw=$("ap").value,nm=$("an")?$("an").value.trim():"";
    if(!/^\S+@\S+\.\S+$/.test(em))return fail("Enter a valid email address.");
    if(pw.length<6)return fail("Password needs at least 6 characters.");
    if(mode==="register"&&!nm)return fail("Enter your name.");
    b.disabled=true;
    const r=mode==="login"?await sb.auth.signInWithPassword({email:em,password:pw}):await sb.auth.signUp({email:em,password:pw,options:{data:{full_name:nm}}});
    b.disabled=false;
    if(r.error)return fail(r.error.message);
    if(!r.data.session)return fail("Check your email to confirm your account, then log in.");
    await loadUser(r.data.session);const n=after||"home";after=null;toast("Welcome, "+user.name);return go(n)}
  if(d.lo!==undefined){await sb.auth.signOut();user=null;wish=new Set();orders=[];toast("Logged out");return go("home")}
  if(d.recv){const r=await sb.rpc("mark_received",{p_order:+d.recv});if(r.error)return toast(r.error.message);toast("Thanks! You can review your items now");return go("orders-toreview")}
  if(d.rv){const[oid,ix]=d.rv.split(":").map(Number);return openReview(oid,ix)}
  if(d.chk!==undefined)return total()?go("checkout"):toast("Select an item to check out");
  if(d.mv){const i=cart[+d.mv];
    if(!user){after="cart";toast("Log in to save items");return go("login")}
    if(!wish.has(i.pid)){const r=await sb.from("wishlist").insert({user_id:user.id,product_id:i.pid});if(r.error)return toast("Couldn’t move it to your wishlist");wish.add(i.pid)}
    cart.splice(+d.mv,1);toast("Moved to wishlist");return route()}
  if(d.ea!==undefined){co.editing=true;return route()}
  if(d.sa!==undefined){keep();
    if(!co.name||(co.phone||"").replace(/\D/g,"").length<7||!co.addr||!co.town)return $("aerr").textContent="Enter your name, a valid phone number, address and town.";
    co.editing=false;co.point="";if(co.ship==="collect"&&!pickups.some(p=>p.dzongkhag===co.town))co.ship="";return route()}
  if(b.id==="pdone"){keep();
    if(co.editing||!co.addr)return fail("Save your address first.");
    if(!co.ship)return fail("Choose a shipping method.");
    if(!co.pay)return fail("Choose a payment method.");
    if(co.pay==="mbob"&&!co.file)return fail("Add your payment screenshot (JPG or PNG, up to 5MB).");
    if(co.pay==="mbob"&&!co.journal)return fail("Type your journal number.");
    b.disabled=true;b.textContent="Placing order…";
    const reset=()=>{b.disabled=false;b.textContent="Payment done"};
    let path="";
    if(co.pay==="mbob"){path=`${user.id}/${Date.now()}.${co.file.type==="image/png"?"png":"jpg"}`;
      const up=await sb.storage.from("payment-screenshots").upload(path,co.file,{contentType:co.file.type});
      if(up.error){reset();return fail("Couldn’t upload your screenshot. Please try again.")}}
    const items=cart.filter(i=>i.sel).map(i=>({product_id:i.pid,size:i.size,qty:i.qty}));
    const px=pickups.find(y=>y.id===pickId()),where=co.ship==="collect"?(px?`${px.name}, ${px.address}`:""):`${co.addr}, ${co.town}`;
    const r=await sb.rpc("place_order",{p_items:items,p_name:co.name,p_phone:co.phone,p_address:co.addr,p_town:co.town,p_shipping:co.ship,
      p_pickup:co.ship==="collect"?pickId():null,p_payment:co.pay,p_journal:co.journal||null,p_screenshot:path||null});
    reset();
    if(r.error)return fail(r.error.message);
    lastOrder={id:r.data,name:co.name,phone:co.phone,shipLabel:SHIP[co.ship],pay:co.pay,total:total()+shipFee(co.ship,co.town,total()),journal:co.journal||"",where};
    {const o2=await sb.from("orders").select("total").eq("id",r.data).single();if(o2.data)lastOrder.total=o2.data.total}
    sb.from("profiles").update({phone:co.phone}).eq("id",user.id).then(()=>{});user.phone=co.phone;
    cart=cart.filter(i=>!i.sel);co={name:co.name,phone:co.phone,addr:co.addr,town:co.town};
    await loadProducts();return go("done")}
});
$("app").addEventListener("change",async e=>{
  const t=e.target;
  if(t.dataset.sel!==undefined){cart[+t.dataset.sel].sel=t.checked;return route()}
  if(t.id==="all"){cart.forEach(i=>i.sel=t.checked);return route()}
  if(t.id==="pt"){keep();return route()}
  if(t.name==="ship"){keep();co.ship=t.value;return route()}
  if(t.name==="pay"){keep();co.pay=t.value;return route()}
  if(t.id==="avatar"){const f=t.files[0];if(!f)return;
    if(!/^image\/(png|jpeg)$/.test(f.type)||f.size>5*1024*1024){t.value="";return toast("Use a JPG or PNG up to 5MB")}
    const path=`${user.id}/avatar-${Date.now()}.${f.type==="image/png"?"png":"jpg"}`;
    const up=await sb.storage.from("avatars").upload(path,f,{contentType:f.type});if(up.error)return toast("Couldn’t upload your photo");
    const r=await sb.from("profiles").update({avatar_url:path}).eq("id",user.id);if(r.error)return toast("Couldn’t save your photo");
    if(user.avatarPath)sb.storage.from("avatars").remove([user.avatarPath]);
    user.avatarPath=path;user.avatar=pubUrl("avatars",path);return route()}
  if(t.id==="shot"){const f=t.files[0];if(!f)return;
    if(!/^image\/(png|jpeg)$/.test(f.type)||f.size>5*1024*1024){t.value="";return toast("Use a JPG or PNG up to 5MB")}
    keep();co.file=f;const r=new FileReader();r.onload=()=>{co.img=r.result;route()};r.readAsDataURL(f)}
});

sb.auth.onAuthStateChange(ev=>{if(ev==="PASSWORD_RECOVERY")setTimeout(async()=>{const{data}=await sb.auth.getSession();await loadUser(data.session);go("newpassword")},0)});
async function init(){
  $("app").innerHTML='<p class="empty">Loading the shop…</p>';
  try{
    const{data:{session}}=await sb.auth.getSession();
    await Promise.all([loadProducts(),loadReviews(),loadPickups()]);
    await loadUser(session);
  }catch(e){toast("Couldn’t reach the shop. Check your internet connection.")}
  try{cart=JSON.parse(localStorage.getItem("behyu-cart")||"[]").filter(i=>P(i.pid)).map(i=>({...i,qty:Math.min(i.qty,Math.max(1,P(i.pid).stock))}))}catch(e){cart=[]}
  route();
}
init();
</script>
</body>
